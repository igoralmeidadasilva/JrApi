networks:
  jr.api.network:
    driver: bridge
    name: jr.api.network

services:
  jr.api.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jr.api.sqlserver 
    environment:
      MSSQL_SA_PASSWORD: "SqlServer2022!"
      ACCEPT_EULA: "Y"
    networks:
      - jr.api.network
    ports:
      - "1433:1433"
    volumes:
      - jr.api.database.data:/var/opt/mssql

volumes:
  jr.api.database.data:
    driver: local
    name: jr.api.sqlserver.volume